<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>つながるチャット</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
:root{color-scheme:light;--bg:#f3f5fb;--panel:#fff;--ink:#20243a;--muted:#737b91;--accent:#5b62e8;--line:#e7e9f2}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);min-height:100vh;display:grid;place-items:center;padding:18px}
.app{width:min(100%,760px);height:min(850px,calc(100vh - 36px));min-height:560px;background:var(--panel);border-radius:24px;box-shadow:0 18px 60px #28315b18;display:flex;flex-direction:column;overflow:hidden}
header{padding:22px 24px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:13px}
.logo{width:44px;height:44px;border-radius:15px;background:linear-gradient(135deg,#777df4,#555be0);display:grid;place-items:center;color:white;font-size:23px}
h1{font-size:20px;margin:0} .sub{font-size:12px;color:var(--muted);margin-top:3px}
.status{margin-left:auto;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:7px}
.dot{width:8px;height:8px;border-radius:50%;background:#f0b44b}.dot.online{background:#22b573}
.setup{padding:14px 20px;background:#fafaff;border-bottom:1px solid var(--line);display:grid;gap:10px}
.setup-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
input{font:inherit;min-width:0;border:1px solid #dfe2ef;border-radius:12px;padding:11px 12px;background:white;outline:none}
input:focus{border-color:var(--accent);box-shadow:0 0 0 3px #5b62e81c}
#nickname{width:145px}#remoteId{flex:1;min-width:150px}
#friendName{width:140px}#friendId{flex:1;min-width:150px}
button{font:inherit;font-weight:650;border:0;border-radius:12px;padding:11px 15px;cursor:pointer;transition:transform .12s,opacity .12s}
button:active{transform:scale(.98)}button:disabled{opacity:.45;cursor:not-allowed}
.primary{background:var(--accent);color:white}.secondary{background:#eceeff;color:#454bd0}.copy{background:#e9f8f0;color:#14784c}
.small{font-size:12px;color:var(--muted);line-height:1.6}
.friends{padding:12px 20px;border-bottom:1px solid var(--line);display:grid;gap:9px;background:#fff}
.friends-title{font-size:13px;font-weight:750;display:flex;align-items:center;justify-content:space-between}
.friend-list{display:grid;gap:7px;max-height:140px;overflow:auto}
.friend{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:12px;padding:8px 10px;min-width:0}
.friend-info{flex:1;min-width:0}.friend-name{font-size:13px;font-weight:700;overflow-wrap:anywhere}.friend-id{font-size:10px;color:var(--muted);overflow-wrap:anywhere}
.friend button{padding:7px 10px;font-size:12px;white-space:nowrap}.remove-friend{background:#f4f5f9;color:#747b8e}
#myId{font-weight:700;color:#454bd0;overflow-wrap:anywhere}
.messages{padding:24px;flex:1;min-height:280px;overflow-y:auto;display:flex;flex-direction:column;gap:16px;scrollbar-gutter:stable}
.notice{text-align:center;font-size:13px;color:var(--muted);background:#f5f6fb;border-radius:12px;padding:10px 14px;align-self:center;max-width:100%}
.msg{max-width:min(86%,600px);display:flex;flex-direction:column;gap:6px;align-self:flex-start}
.msg.mine{align-self:flex-end;align-items:flex-end}
.meta{font-size:13px;color:var(--muted);padding:0 5px}
.bubble{padding:14px 17px;border-radius:18px 18px 18px 5px;background:#f0f1f8;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.65;font-size:17px}
.mine .bubble{background:var(--accent);color:white;border-radius:18px 18px 5px 18px}
.composer{padding:16px 18px;border-top:1px solid var(--line);display:flex;gap:10px;background:#fff}
#message{flex:1}
footer{padding:0 20px 14px;text-align:center;font-size:11px;color:#969caf}
@media(max-width:520px){body{padding:0}.app{height:100dvh;min-height:0;border-radius:0}.setup{padding:10px;gap:8px}.friends{padding:9px 12px;gap:7px}.friend-list{max-height:92px}.messages{padding:16px;min-height:180px;gap:13px}.msg{max-width:92%}.bubble{font-size:17px;padding:13px 15px}.meta{font-size:12px}header{padding:17px}.composer{padding:12px}.setup-row button{padding:11px}}
</style>
</head>
<body>
<main class="app">
  <header>
    <div class="logo">✉</div>
    <div><h1>つながるチャット</h1><div class="sub">別の端末とメッセージを交換しよう</div></div>
    <div class="status"><span class="dot" id="dot"></span><span id="statusText">接続準備中</span></div>
  </header>
  <section class="setup">
    <div class="setup-row">
      <input id="nickname" maxlength="24" placeholder="ニックネーム" value="ゲスト" aria-label="ニックネーム">
      <button class="secondary" id="startBtn">チャットを開始</button>
    </div>
    <div class="small">あなたの接続ID： <span id="myId">開始ボタンを押してください</span>
      <button class="copy" id="copyBtn" disabled style="padding:5px 9px;margin-left:6px;font-size:12px">招待リンクをコピー</button>
    </div>
    <div class="setup-row">
      <input id="remoteId" placeholder="相手の接続IDを入力" autocomplete="off" aria-label="相手の接続ID">
      <button class="primary" id="connectBtn" disabled>相手に接続</button>
    </div>
    <div class="small">初回だけ友達の接続IDを登録しよう。自分のIDは同じブラウザで使う限り保存されるよ。</div>
  </section>
  <section class="friends">
    <div class="friends-title"><span>👥 友達リスト</span><span class="small">この端末に保存</span></div>
    <form class="setup-row" id="addFriendForm">
      <input id="friendName" maxlength="24" placeholder="友達の名前" aria-label="友達の名前" required>
      <input id="friendId" placeholder="友達の接続ID" autocomplete="off" aria-label="友達の接続ID" required>
      <button class="secondary" type="submit">友達追加</button>
    </form>
    <div class="small">友達の接続IDを最初の1回だけ登録すると、次からはリストの「接続」でチャットできるよ。</div>
    <div class="friend-list" id="friendList"><div class="small">まだ友達がいません。上から追加してね。</div></div>
  </section>
  <section class="messages" id="messages" aria-live="polite">
    <div class="notice">まず「チャットを開始」を押してね。</div>
  </section>
  <form class="composer" id="sendForm">
    <input id="message" placeholder="メッセージを入力…" maxlength="2000" autocomplete="off" disabled aria-label="メッセージ">
    <button class="primary" id="sendBtn" disabled>送信 ➤</button>
  </form>
  <footer>友達リストと自分のIDはこのブラウザ内に保存されます。ブラウザのデータを消すと失われます。接続IDは信頼できる相手にだけ共有してください。</footer>
</main>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const FRIENDS_KEY = 'tsunagaruChatFriendsV1';
  const PEER_KEY = 'tsunagaruChatPeerIdV1';
  let peer = null, connection = null, connections = new Set(), started = false, autoConnectAttempted = false, pendingTarget = '';
  const receivedMessageIds = new Set();
  let friends = loadFriends();
  const inviteTarget = new URLSearchParams(location.search).get('to');
  function loadFriends() {
    try {
      const value = JSON.parse(localStorage.getItem(FRIENDS_KEY) || '[]');
      return Array.isArray(value) ? value.filter(x => x && typeof x.id === 'string' && typeof x.name === 'string') : [];
    } catch { return []; }
  }
  function saveFriends() { localStorage.setItem(FRIENDS_KEY, JSON.stringify(friends)); }
  const setStatus = (text, online=false) => {
    $('statusText').textContent = text;
    $('dot').classList.toggle('online', online);
  };
  const notice = text => {
    const el = document.createElement('div');
    el.className = 'notice'; el.textContent = text;
    $('messages').appendChild(el); scrollDown();
  };
  const scrollDown = () => { $('messages').scrollTop = $('messages').scrollHeight; };
  const addMessage = (name, text, mine=false, time=new Date()) => {
    const wrap = document.createElement('div'); wrap.className = 'msg' + (mine ? ' mine' : '');
    const meta = document.createElement('div'); meta.className = 'meta';
    meta.textContent = name + ' · ' + time.toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'});
    const bubble = document.createElement('div'); bubble.className = 'bubble'; bubble.textContent = text;
    wrap.append(meta,bubble); $('messages').appendChild(wrap); scrollDown();
  };
  const enableChat = on => { $('message').disabled = !on; $('sendBtn').disabled = !on; };
  function renderFriends() {
    const list = $('friendList'); list.replaceChildren();
    if (!friends.length) {
      const empty = document.createElement('div'); empty.className = 'small'; empty.textContent = 'まだ友達がいません。上から追加してね。'; list.appendChild(empty); return;
    }
    friends.forEach((friend, index) => {
      const row = document.createElement('div'); row.className = 'friend';
      const info = document.createElement('div'); info.className = 'friend-info';
      const name = document.createElement('div'); name.className = 'friend-name'; name.textContent = friend.name;
      const id = document.createElement('div'); id.className = 'friend-id'; id.textContent = friend.id;
      info.append(name, id);
      const connect = document.createElement('button'); connect.type = 'button'; connect.className = 'primary'; connect.textContent = '接続';
      connect.addEventListener('click', () => {
        $('remoteId').value = friend.id;
        if (!peer || !peer.open) { pendingTarget = friend.id; startPeer(); notice(friend.name + 'に接続する準備をしています…'); }
        else connectTo(friend.id);
      });
      const remove = document.createElement('button'); remove.type = 'button'; remove.className = 'remove-friend'; remove.textContent = '削除';
      remove.addEventListener('click', () => {
        friends.splice(index, 1); saveFriends(); renderFriends(); notice(friend.name + 'を友達リストから削除しました。');
      });
      row.append(info, connect, remove); list.appendChild(row);
    });
  }
  const attachConnection = conn => {
    // 同時に接続ボタンが押されても、開いている接続を管理して送信できるようにする
    connections.add(conn);
    conn.on('open', () => {
      if (!connection || !connection.open) connection = conn;
      setStatus('接続中', true); enableChat(true);
      notice('相手と接続しました！メッセージを送れます。');
    });
    conn.on('data', data => {
      if (data && data.type === 'message' && typeof data.text === 'string') {
        // 複数の接続ができた場合の重複表示を防ぐ
        if (data.messageId && receivedMessageIds.has(data.messageId)) return;
        if (data.messageId) {
          receivedMessageIds.add(data.messageId);
          if (receivedMessageIds.size > 1000) receivedMessageIds.delete(receivedMessageIds.values().next().value);
        }
        addMessage(String(data.name || '相手').slice(0,24), data.text.slice(0,2000), false,
          data.time ? new Date(data.time) : new Date());
      }
    });
    conn.on('close', () => {
      connections.delete(conn);
      if (connection === conn) connection = [...connections].find(c => c.open) || null;
      const stillConnected = [...connections].some(c => c.open);
      setStatus(stillConnected ? '接続中' : '切断されました', stillConnected);
      enableChat(stillConnected);
      if (!stillConnected) notice('接続が切れました。友達リストから再接続できます。');
    });
    conn.on('error', () => {
      connections.delete(conn);
      if (connection === conn) connection = [...connections].find(c => c.open) || null;
      const stillConnected = [...connections].some(c => c.open);
      enableChat(stillConnected);
      if (!stillConnected) notice('通信エラーが発生しました。相手がチャットを開始しているか確認してください。');
    });
  };
  function connectTo(id) {
    id = (id || '').trim();
    if (!peer || !peer.open || !id) { notice('先に「チャットを開始」を押してください。'); return; }
    if (id === peer.id) { notice('自分自身には接続できません。友達のIDを確認してください。'); return; }
    if ([...connections].some(c => c.open && c.peer === id)) {
      notice('その友達とはすでに接続しています。メッセージを送れます。');
      enableChat(true); return;
    }
    $('remoteId').value = id; setStatus('相手に接続中'); attachConnection(peer.connect(id, { reliable: true }));
  }
  function startPeer() {
    if (started) return;
    if (typeof Peer === 'undefined') { notice('通信ライブラリを読み込めませんでした。ネット接続を確認して再読み込みしてください。'); return; }
    started = true; $('startBtn').disabled = true; setStatus('サーバーに接続中');
    const savedId = localStorage.getItem(PEER_KEY);
    let retriedWithRandomId = false;
    function createPeer(id) {
      peer = id ? new Peer(id) : new Peer();
      peer.on('open', id => {
        localStorage.setItem(PEER_KEY, id);
        $('myId').textContent = id; $('copyBtn').disabled = false; $('connectBtn').disabled = false;
        setStatus('接続待ち', false); notice('準備できました。友達リストから相手を選べます。');
        const target = pendingTarget || inviteTarget;
        if (target && !autoConnectAttempted) {
          autoConnectAttempted = true; pendingTarget = '';
          if (target === id) notice('自分自身には接続できません。');
          else { $('remoteId').value = target; connectTo(target); }
        }
      });
      peer.on('connection', conn => attachConnection(conn));
      peer.on('error', err => {
        if (err.type === 'unavailable-id' && id && !retriedWithRandomId) {
          retriedWithRandomId = true;
          try { peer.destroy(); } catch {}
          localStorage.removeItem(PEER_KEY); peer = null; started = false; $('startBtn').disabled = false;
          notice('保存していたIDが別のタブなどで使用中です。新しいIDで準備し直します。');
          startPeer(); return;
        }
        setStatus('接続エラー'); notice('接続エラー：' + (err.type || '通信に失敗しました') + '。ページを再読み込みして試してください。');
        $('startBtn').disabled = false; started = false;
      });
      peer.on('disconnected', () => setStatus('再接続が必要です'));
    }
    createPeer(savedId || '');
  }
  $('startBtn').addEventListener('click', startPeer);
  $('addFriendForm').addEventListener('submit', e => {
    e.preventDefault();
    const name = $('friendName').value.trim().slice(0,24);
    const id = $('friendId').value.trim();
    if (!name || !id) return;
    if (peer && id === peer.id) { notice('自分のIDは友達に追加できません。'); return; }
    const existing = friends.findIndex(f => f.id === id);
    if (existing >= 0) friends[existing] = {name, id};
    else friends.push({name, id});
    saveFriends(); renderFriends(); $('friendName').value = ''; $('friendId').value = '';
    notice(name + 'を友達リストに保存しました。');
  });
  $('copyBtn').addEventListener('click', async () => {
    if (!peer || !peer.id) return;
    const url = new URL(location.href); url.searchParams.set('to', peer.id);
    try { await navigator.clipboard.writeText(url.href); $('copyBtn').textContent = 'コピー済み'; notice('招待リンクをコピーしました。相手に送ってください。'); }
    catch { window.prompt('この招待リンクをコピーして相手に送ってください', url.href); }
  });
  $('connectBtn').addEventListener('click', () => connectTo($('remoteId').value));
  $('sendForm').addEventListener('submit', e => {
    e.preventDefault();
    const text = $('message').value.trim();
    if (!text) return;
    const openConnections = [...connections].filter(conn => conn.open);
    if (!openConnections.length) {
      if (connection && connection.open) openConnections.push(connection);
      else {
        enableChat(false);
        notice('まだ相手と接続されていません。友達リストの「接続」から接続し直してください。');
        return;
      }
    }
    const name = $('nickname').value.trim().slice(0,24) || 'ゲスト';
    const time = new Date();
    const messageId = (globalThis.crypto && crypto.randomUUID) ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2);
    const payload = {type:'message', messageId, name, text, time:time.toISOString()};
    let sent = false;
    for (const conn of openConnections) {
      try { conn.send(payload); sent = true; } catch (err) { /* try remaining open connections */ }
    }
    if (!sent) {
      notice('送信できませんでした。接続し直して、もう一度試してください。');
      return;
    }
    if (messageId) receivedMessageIds.add(messageId);
    addMessage(name, text, true, time);
    $('message').value = ''; $('message').focus();
  });
  renderFriends();
  if (inviteTarget) notice('招待リンクを開きました。「チャットを開始」を押すと接続を試みます。');
  window.addEventListener('beforeunload', () => { if (peer) peer.destroy(); });
})();
</script>
</body>
</html>
